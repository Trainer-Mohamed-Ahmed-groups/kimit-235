<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Todo</title>
    <style>
        li {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="w-50 mx-auto mt-5">
        <input type="text" class="form-control mt-5 mb-2" id="taskInput" placeholder="Enter your task here" autofocus>

        <div class="d-flex justify-content-between mb-3">
            <h4>Tasks: <span class="badge text-bg-info mb-2" id="tasksCounter">0</span></h4>
            <h4>Finished tasks: <span class="badge text-bg-info mb-2" id="finishedTasksCounter">0</span></h4>
        </div>

        <ul class="list-group" id="tasksOutput"></ul>
    </div>

    <script src="./js/todo.js"></script>
</body>

</html>
