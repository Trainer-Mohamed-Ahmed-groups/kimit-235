<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./css/style.css">
    <title>Front end session</title>

</head>

<body>
    <button id="myBtn">Click me</button>

    <input type="text" id="myInput">

    <div id="output"></div>

    <hr>
    <form action="">
        <input type="text">
        <input type="submit" value="OK">
    </form>

    <ul>
        <li>Test 1</li>
        <li>Test 2</li>
        <li>Test 3</li>
        <li>Test 4</li>
        <li>Test 5</li>
    </ul>


    <div class="container">
        <div class="row mb-3">
            <div class="col-8">
                <input class="form-control" type="text" id="taskInput" />
            </div>
            <div class="col-4 gap-2 d-flex justify-content-end">
                <button class="btn btn-danger" onclick="removeAllTasks()">Remove all tasks</button>
                <button class="btn btn-primary" onclick="addNewTask()">Add</button>
            </div>
        </div>
        <ol class="list-group list-group-numbered" id="tasksOutput"></ol>
        <span class="badge text-bg-secondary" id="tasksCounter"></span>
    </div>
    <script src="./js/main.js"></script>
</body>

</html>
